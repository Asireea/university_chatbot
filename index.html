<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Python Workflow Web Interface</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 2rem;
      background: #f8f9fa;
    }
    #container {
      background: white;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      max-width: 600px;
      margin: auto;
    }
    input, button {
      padding: 0.5rem;
      font-size: 1rem;
    }
    input {
      width: 70%;
    }
    button {
      background: #007bff;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    button:hover {
      background: #0056b3;
    }
    pre {
      background: #f1f3f5;
      padding: 1rem;
      border-radius: 8px;
      white-space: pre-wrap;
      margin-top: 1rem;
    }
  </style>
</head>
<body>
  <div id="container">
    <h2>Python Workflow Web Interface</h2>
    <input id="userInput" placeholder="Enter your request" />
    <button id="sendBtn">Run</button>
    <pre id="output"></pre>
  </div>

  <script>
    document.getElementById("sendBtn").onclick = async () => {
      const userInput = document.getElementById("userInput").value;
      const outputEl = document.getElementById("output");
      outputEl.textContent = "Processing...";

      const response = await fetch("/run", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ user_input: userInput })
      });

      const data = await response.json();
      outputEl.textContent = data.agent_output;
    };
  </script>
</body>
</html>
